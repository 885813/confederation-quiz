<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creating Canada — Interactive Quiz</title>
<style>
  :root { --ink:#17243b; --blue:#174a7e; --pale:#eef5fb; --line:#d7e0ea; --green:#18794e; --red:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:linear-gradient(135deg,#eaf3fb,#f8fafc); }
  main { max-width:850px; margin:32px auto; padding:0 16px 36px; }
  .card { background:white; border:1px solid var(--line); border-radius:20px; padding:clamp(20px,4vw,34px); box-shadow:0 12px 34px #17243b12; }
  h1 { margin:0 0 8px; color:var(--blue); font-size:clamp(1.7rem,4vw,2.3rem); }
  .sub { margin:0 0 22px; color:#52647a; line-height:1.5; }
  .topline { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; font-weight:700; }
  .track { height:9px; background:#e6edf4; border-radius:99px; overflow:hidden; margin-bottom:24px; }
  .bar { height:100%; width:0%; background:var(--blue); transition:width .2s ease; }
  #question { font-size:1.25rem; line-height:1.45; margin:0 0 18px; }
  .answers { display:grid; gap:11px; }
  .answer { display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:2px solid var(--line); border-radius:13px; background:white; padding:14px 15px; color:var(--ink); font:inherit; cursor:pointer; transition:background .15s,border-color .15s; }
  .answer:hover:not(:disabled) { border-color:var(--blue); background:var(--pale); }
  .letter { display:inline-grid; place-items:center; flex:0 0 29px; height:29px; border-radius:8px; background:#edf2f7; font-weight:800; }
  .answer.correct { border-color:var(--green); background:#effaf4; }
  .answer.wrong { border-color:var(--red); background:#fff3f2; }
  .answer:disabled { cursor:default; }
  #feedback { min-height:54px; margin:18px 0 8px; line-height:1.5; }
  #feedback.good { color:var(--green); } #feedback.bad { color:var(--red); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  button.action { border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:750; cursor:pointer; }
  #next { color:white; background:var(--blue); } #next:disabled { opacity:.45; cursor:not-allowed; }
  #restart { color:var(--blue); background:#eaf2f9; }
  .small { font-size:.9rem; color:#5b6b7d; margin-top:18px; }
  .result { text-align:center; }
  .score { font-size:3rem; font-weight:850; color:var(--blue); margin:12px 0; }
  .review { text-align:left; margin-top:24px; }
  .review-item { border-top:1px solid var(--line); padding:14px 0; line-height:1.5; }
  .review-item strong { display:block; margin-bottom:5px; }
  @media(max-width:520px) { main { margin:16px auto; } .topline { font-size:.92rem; } }
</style>
</head>
<body>
<main>
  <section class="card" id="quiz">
    <h1>🇨🇦 Creating Canada Quiz</h1>
    <p class="sub">Confederation &amp; Indigenous Peoples · 15 multiple-choice questions · Based on your study guide.</p>
    <div class="topline"><span id="count">Question 1 of 15</span><span id="score">Score: 0</span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div id="feedback" aria-live="polite"></div>
    <div class="controls">
      <button class="action" id="next" disabled>Next question →</button>
      <button class="action" id="restart">Start over</button>
    </div>
    <p class="small">Choose an answer to get instant feedback. Your final score and answer review appear at the end.</p>
  </section>
</main>
<script>
const questions = [
 {q:"When did Canada become a country?",a:["July 1, 1864","July 1, 1867","July 1, 1871","July 1, 1876"],c:1,e:"Canada became a country on July 1, 1867."},
 {q:"Who became Canada's first Prime Minister?",a:["George Brown","Louis Riel","Sir John A. Macdonald","Alexander Mackenzie"],c:2,e:"Sir John A. Macdonald was Canada's first Prime Minister."},
 {q:"Which four provinces formed Canada in 1867?",a:["Ontario, Quebec, Manitoba, Nova Scotia","Ontario, Quebec, New Brunswick, Nova Scotia","Quebec, Prince Edward Island, Alberta, Ontario","Ontario, British Columbia, New Brunswick, Quebec"],c:1,e:"The first four provinces were Ontario, Quebec, New Brunswick and Nova Scotia."},
 {q:"Which was one reason colonies considered Confederation?",a:["To join the United States","To end all railway construction","Fear of American expansion","To create a single official religion"],c:2,e:"Fear of American expansion, including possible attacks or annexation, was one reason."},
 {q:"What did the end of the Reciprocity Treaty in 1866 cause?",a:["Concern about access to American markets","The creation of the Indian Act","The end of all trade between colonies","The start of the Quebec Conference"],c:0,e:"The United States ended the treaty, raising concerns about access to American markets."},
 {q:"What did political deadlock mean in the Province of Canada?",a:["The railway was completed","The government struggled to make decisions because of disagreements","All colonies agreed on every law","The British Parliament stopped meeting"],c:1,e:"Canada East and Canada West often disagreed, making it difficult to pass laws and form a stable government."},
 {q:"What was the correct order of the three Confederation conferences?",a:["Quebec, London, Charlottetown","London, Charlottetown, Quebec","Charlottetown, Quebec, London","Charlottetown, London, Quebec"],c:2,e:"The conferences were Charlottetown (September 1864), Quebec (October 1864), then London (December 1866 to early 1867)."},
 {q:"What were the 72 Resolutions?",a:["A treaty with the United States","A detailed plan for the new country's government","A list of railway stations","The first four provincial laws"],c:1,e:"Delegates agreed to the 72 Resolutions at the Quebec Conference in 1864."},
 {q:"What did the British North America (BNA) Act do?",a:["Created the Dominion of Canada and established its government system in 1867","Created the Numbered Treaties","Made Canada a province of the United States","Passed the Indian Act in 1876"],c:0,e:"The BNA Act came into effect on July 1, 1867 and established Canada's federal system."},
 {q:"Which is an example of a federal government responsibility in the study guide?",a:["Education","Hospitals","Municipal institutions","National defence"],c:3,e:"National defence is a federal responsibility. Education, hospitals and municipal institutions are provincial responsibilities in the guide."},
 {q:"Which is an example of a provincial government responsibility?",a:["Currency and coinage","Criminal law","Education","Postal service"],c:2,e:"Education is listed as a provincial responsibility."},
 {q:"What were the Numbered Treaties?",a:["Eleven treaties negotiated between the Crown and First Nations from 1871 to 1921","Seventy-two laws passed in 1867","Trade agreements with the United States","Agreements between the four first provinces only"],c:0,e:"The Numbered Treaties were 11 treaties negotiated from 1871 to 1921."},
 {q:"According to the study guide, why did many First Nations consider the treaties unfair?",a:["Every promise was fulfilled immediately","Negotiations were unequal and there could be language barriers and different understandings","The treaties only discussed railway schedules","First Nations were not living in these territories"],c:1,e:"The guide describes unequal power, language and translation barriers, different understandings, and promises that were not always fulfilled."},
 {q:"When was the Indian Act passed?",a:["1864","1867","1871","1876"],c:3,e:"The Indian Act was passed in 1876."},
 {q:"What was a major purpose and effect of the Indian Act and related government policies?",a:["To give First Nations complete control over federal policy","To promote assimilation and give the federal government extensive control over many aspects of First Nations life","To establish the three Confederation conferences","To end all government involvement in reserve administration"],c:1,e:"The guide explains that the Act gave the federal government extensive authority and that government policy aimed to control and assimilate First Nations."}
];
let index=0, points=0, locked=false, chosen=[];
const $=id=>document.getElementById(id);
function render(){
 locked=false;
 $("count").textContent=`Question ${index+1} of ${questions.length}`;
 $("score").textContent=`Score: ${points}`;
 $("bar").style.width=`${index/questions.length*100}%`;
 $("question").textContent=questions[index].q;
 $("answers").innerHTML="";
 $("feedback").textContent="";
 $("feedback").className="";
 $("next").disabled=true;
 $("next").textContent=index===questions.length-1?"See results →":"Next question →";
 questions[index].a.forEach((answer,i)=>{
   const b=document.createElement("button"); b.className="answer";
   b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${answer}</span>`;
   b.addEventListener("click",()=>select(i)); $("answers").appendChild(b);
 });
}
function select(i){
 if(locked)return; locked=true;
 const q=questions[index], buttons=[...$("answers").children], correct=i===q.c;
 chosen[index]=i; if(correct)points++;
 buttons.forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add("correct");if(j===i&&!correct)b.classList.add("wrong");});
 $("feedback").className=correct?"good":"bad";
 $("feedback").textContent=(correct?"✓ Correct! ":"✗ Not quite. ")+q.e;
 $("score").textContent=`Score: ${points}`; $("next").disabled=false;
}
function next(){
 if(!locked)return;
 index++;
 if(index<questions.length){render();return;}
 showResults();
}
function showResults(){
 $("bar").style.width="100%";
 const pct=Math.round(points/questions.length*100);
 let heading=pct===100?"Perfect score!":pct>=80?"Great work!":pct>=60?"Good effort!":"Keep practising!";
 $("quiz").innerHTML=`<div class="result"><h1>Quiz complete! 🎉</h1><p class="sub">${heading} Here are your results.</p><div class="score">${points} / ${questions.length}</div><p>${pct}% correct</p><button class="action" id="restartResult" style="background:#174a7e;color:white">Try again ↻</button></div><div class="review"><h2>Answer review</h2>${questions.map((q,i)=>{const ok=chosen[i]===q.c;return `<div class="review-item"><strong>${i+1}. ${q.q}</strong><span style="color:${ok?'#18794e':'#b42318'}">${ok?'✓ Correct':'✗ Your answer: '+(chosen[i]===undefined?'Not answered':String.fromCharCode(65+chosen[i])+') '+q.a[chosen[i]])}</span><div>Correct answer: <b>${String.fromCharCode(65+q.c)}) ${q.a[q.c]}</b></div><div>${q.e}</div></div>`}).join("")}</div>`;
 $("restartResult").addEventListener("click",restart);
}
function restart(){index=0;points=0;chosen=[];$("quiz").innerHTML=`<h1>🇨🇦 Creating Canada Quiz</h1><p class="sub">Confederation &amp; Indigenous Peoples · 15 multiple-choice questions · Based on your study guide.</p><div class="topline"><span id="count">Question 1 of 15</span><span id="score">Score: 0</span></div><div class="track"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div><div class="controls"><button class="action" id="next" disabled>Next question →</button><button class="action" id="restart">Start over</button></div><p class="small">Choose an answer to get instant feedback. Your final score and answer review appear at the end.</p>`;$("next").addEventListener("click",next);$("restart").addEventListener("click",restart);render();}
$("next").addEventListener("click",next);$("restart").addEventListener("click",restart);render();
</script>
</body>
</html>
